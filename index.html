<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0c0d10" />
    <meta
      name="description"
      content="Тактильна головоломка П'ятнашки (4x4) з плавною FLIP-фізикою плиток, підтримкою свайпів і таблицею особистих рекордів."
    />
    <title>П'ятнашки — 15 Puzzle</title>

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2215%22 fill=%22%2314161c%22/><rect x=%223%22 y=%223%22 width=%2258%22 height=%2258%22 rx=%2213%22 fill=%22none%22 stroke=%22%23ffffff%22 stroke-opacity=%220.14%22 stroke-width=%222%22/><circle cx=%2250%22 cy=%2214%22 r=%224%22 fill=%22%2334d399%22/><text x=%2231%22 y=%2243%22 text-anchor=%22middle%22 font-family=%22system-ui,sans-serif%22 font-weight=%22800%22 font-size=%2228%22 fill=%22%23f4f4f6%22>15</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css?v=4" />
    <script src="script.js?v=4" defer></script>
  </head>
  <body>
    <main class="app-stage">
      <section class="puzzle-chassis" aria-label="Головоломка П'ятнашки">
        <header class="chassis-top">
          <div class="brand">
            <span class="brand-keycap" aria-hidden="true">15</span>
            <h1 class="brand-title">П'ятнашки</h1>
          </div>

          <div class="toolbar-actions">
            <button
              type="button"
              id="openRecords"
              class="records-trigger"
              aria-label="Відкрити таблицю рекордів"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
              </svg>
              <span id="recordsTriggerLabel">Рекорди</span>
            </button>

            <button
              type="button"
              id="toggleSound"
              class="icon-button"
              aria-label="Перемкнути звук"
              aria-pressed="true"
              title="Звук увімкнено"
            >
              <svg id="soundOnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
              <svg id="soundOffIcon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
              </svg>
            </button>
          </div>
        </header>

        <div class="instrument-strip">
          <div class="readout-cell">
            <span class="readout-label">Ходів</span>
            <span id="moves" class="readout-value">0</span>
          </div>
          <div class="readout-cell">
            <span class="readout-label">Час</span>
            <span id="timer" class="readout-value">00:00</span>
          </div>
        </div>

        <div class="game-board-wrapper">
          <div class="game-board" role="grid" aria-label="Ігрове поле 4 на 4"></div>
        </div>

        <footer class="chassis-footer">
          <div class="progress-indicator" aria-label="Зібрано плиток на своїх місцях">
            <span class="progress-dot" aria-hidden="true"></span>
            <span>На місці: <strong id="correctCount">0</strong> / 15</span>
          </div>

          <button type="button" id="startGame" class="shuffle-button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            <span class="button-content">Перемішати</span>
          </button>
        </footer>
      </section>

      <dialog class="modal" id="recordsModal" aria-labelledby="recordsModalTitle">
        <div class="modal-content records-modal-content">
          <div class="modal-header-row">
            <h2 id="recordsModalTitle">Топ-10 рекордів</h2>
            <button type="button" id="closeRecords" class="icon-button close-icon-btn" aria-label="Закрити рекорди">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div id="leaderboardList" class="leaderboard-list"></div>
        </div>
      </dialog>

      <dialog class="modal" id="winModal" aria-labelledby="winTitle">
        <div class="modal-content">
          <div class="win-badge" aria-hidden="true">15</div>
          <h2 id="winTitle">Поле зібрано!</h2>
          <div class="final-stats">
            <div class="stat-box">
              <span class="stat-label">Час</span>
              <span id="finalTime" class="highlight">--:--</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">Ходів</span>
              <span id="finalMoves" class="highlight">0</span>
            </div>
          </div>
          <div class="input-group">
            <label for="playerName" class="sr-only"
              >Ваше ім'я для таблиці рекордів</label
            >
            <input
              type="text"
              id="playerName"
              placeholder="Ваше ім'я"
              maxlength="20"
              autocomplete="off"
            />
          </div>
          <button type="button" id="saveScore" class="primary-button">
            Зберегти рекорд
          </button>
          <button type="button" id="closeModal" class="text-button mt-3">
            Нова партія без запису
          </button>
        </div>
      </dialog>
    </main>

    <canvas
      id="confetti-canvas"
      class="confetti-canvas"
      aria-hidden="true"
    ></canvas>
  </body>
</html>
